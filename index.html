            const addToCart = (product, quantity = 1) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => 
                            item.id === product.id 
                                ? { ...item, quantity: Math.min(item.quantity + quantity, item.stock) } 
                                : item
                        );
                    }
                    return [...prev, { ...product, quantity }];
                });
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        if (newQ > 0 && newQ <= item.stock) return { ...item, quantity: newQ };
                    }
                    return item;
                }));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

                            <h2 className="text-2xl font-medium text-gray-700 mb-2">No orders yet</h2>
                            <p className="text-gray-500 mb-8">You haven't placed any sustainable orders with us.</p>
                            <button onClick={() => navigateTo('shop')} className="bg-[#244C3A] text-white px-8 py-3 rounded-full font-semibold hover:bg-[#1c3a2c] transition-colors">Start Shopping</button>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            {orders.map((order, idx) => (
                                <div key={idx} className="bg-white rounded-2xl shadow-sm border border-[#E7DDCB] overflow-hidden">
                                    <div className="bg-[#F8F6EF] px-6 py-4 border-b border-[#E7DDCB] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div><p className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Order Placed</p><p className="font-semibold text-[#242824]">{order.date}</p></div>
                                        <div><p className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Total</p><p className="font-semibold text-[#242824]">{formatCurrency(order.total)}</p></div>
                                        <div><p className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Order #</p><p className="font-semibold text-[#242824]">{order.orderId}</p></div>
                                        <button onClick={() => { setCompletedOrder(order); setCheckoutStep(4); navigateTo('checkout'); }} className="text-[#244C3A] font-medium hover:bg-[#E7DDCB] text-sm flex items-center border border-[#244C3A] px-4 py-2 rounded-lg bg-white transition-colors">View / Download Invoice</button>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex overflow-x-auto gap-4 pb-2 scrollbar-thin">
                                            {order.items.map((item, itemIdx) => (
                                                <div key={itemIdx} className="flex-shrink-0 w-24 h-24 border border-gray-200 rounded-lg overflow-hidden relative shadow-sm">
                                                    <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                                    <span className="absolute bottom-0 right-0 bg-[#244C3A] text-white text-xs px-2 py-1 font-bold rounded-tl-lg">x{item.quantity}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            const Footer = () => (
                <footer className="bg-[#242824] text-[#E7DDCB] py-16 no-print">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10">
                        <div>
                            <div className="flex items-center mb-6">
                                <Leaf className="h-8 w-8 text-[#A7B99E] mr-2" />
                                <span className="font-bold text-2xl tracking-tight text-white">EcoNest</span>
                            </div>
                            <p className="text-gray-400 text-sm mb-6 leading-relaxed">We're on a mission to make sustainable living accessible, beautiful, and practical for everyone. Small swaps for a greener tomorrow.</p>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-6 uppercase tracking-wider text-sm">Shop</h4>
                            <ul className="space-y-3 text-sm text-gray-400">
                                {CATEGORIES.map(cat => <li key={cat}><button onClick={() => navigateTo('shop', cat)} className="hover:text-white transition-colors">{cat}</button></li>)}
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-6 uppercase tracking-wider text-sm">Support</h4>
                            <ul className="space-y-3 text-sm text-gray-400">
                                <li><a href="#" className="hover:text-white transition-colors">Contact Us</a></li>
                                <li><a href="#" className="hover:text-white transition-colors">FAQs</a></li>
                                <li><a href="#" className="hover:text-white transition-colors">Shipping Policy</a></li>
                                <li><a href="#" className="hover:text-white transition-colors">Returns & Refunds</a></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="text-white font-bold mb-6 uppercase tracking-wider text-sm">Join Our Newsletter</h4>
                            <p className="text-sm text-gray-400 mb-4">Get 10% off your first order and weekly sustainability tips.</p>
                            <div className="flex">
                                <input type="email" placeholder="Email address" className="bg-white/10 text-white border-0 rounded-l-lg px-4 py-2 w-full focus:outline-none focus:ring-1 focus:ring-[#A7B99E] placeholder-gray-500 text-sm" />
                                <button className="bg-[#A7B99E] text-[#242824] px-4 py-2 rounded-r-lg font-bold hover:bg-white transition-colors text-sm">Subscribe</button>
                            </div>
                            <div className="mt-8">
                                <p className="text-xs text-gray-500 mb-2">Secure Payments (Demo)</p>
                                <div className="flex space-x-2 opacity-50"><CreditCard size={24}/><ShieldCheck size={24}/></div>
                            </div>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12 pt-8 border-t border-gray-800 text-center text-xs text-gray-500">
                        &copy; {new Date().getFullYear()} EcoNest Prototype. For demonstration purposes only. Not a real store.
                    </div>
                </footer>
            );

            return (
                <div className={`min-h-screen font-sans flex flex-col bg-[#F8F6EF] text-[#242824] ${checkoutStep === 4 ? 'print:bg-white' : ''}`}>
                    <div className="no-print sticky top-0 z-50"><Header /></div>
                    <main className="flex-grow w-full no-print">
                        {currentView === 'home' && <HomeView />}
                        {currentView === 'shop' && <ShopView />}
                        {currentView === 'product' && <ProductDetailView />}
                        {currentView === 'cart' && <CartView />}
                        {currentView === 'checkout' && <CheckoutView />}
                        {currentView === 'impact' && <ImpactView />}
                        {currentView === 'orders' && <OrdersView />}
                    </main>
                    {completedOrder && checkoutStep === 4 && <OrderConfirmationView order={completedOrder} />}
                    <div className="no-print mt-auto"><Footer /></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
